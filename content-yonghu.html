<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>客户中台 · 用户管理</title>
<style>
  :root{
    --primary:#1677ff;
    --primary-hover:#4096ff;
    --bg:#f5f7fa;
    --border-light:#f0f0f0;
    --text:#1d2129;
    --text-secondary:#4e5969;
    --text-tertiary:#86909c;
    --radius-lg:8px;
    --shadow-card:0 1px 2px rgba(0,0,0,.03),0 1px 6px -1px rgba(0,0,0,.02),0 2px 4px rgba(0,0,0,.02);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Helvetica,Arial,sans-serif;
    font-size:14px;color:var(--text);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);min-height:100vh;display:grid;place-items:center}
  .page{max-width:1400px;margin:0 auto;width:100%;padding:48px 24px}
  .empty{
    background:#fff;border:1px solid var(--border-light);border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    padding:64px 40px;text-align:center;max-width:520px;margin:40px auto;
  }
  .ico{
    width:72px;height:72px;border-radius:18px;background:rgba(22,119,255,.06);
    display:grid;place-items:center;margin:0 auto 20px;
  }
  .ico svg{width:36px;height:36px;stroke:var(--primary);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .title{font-size:20px;font-weight:600;color:var(--text)}
  .desc{margin-top:10px;font-size:14px;color:var(--text-secondary);line-height:1.7}
  .tag{display:inline-block;margin-top:18px;padding:4px 12px;border-radius:999px;background:rgba(22,119,255,.06);color:var(--primary);font-size:13px}
</style>
</head>
<body>
<main class="page">
  <div class="empty">
    <div class="ico">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    </div>
    <div class="title">功能开发中</div>
    <div class="desc">该模块正在开发中，敬请期待。</div>
    <div class="tag">Coming Soon</div>
  </div>
</main>
<script>
  function postHeight(){
    const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
    if(window.parent !== window) window.parent.postMessage({ type:'resize', height:h }, '*');
  }
  window.addEventListener('load', postHeight);
  if(window.ResizeObserver){ new ResizeObserver(postHeight).observe(document.body); }
</script>
</body>
</html>
