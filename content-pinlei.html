<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>品类管理 - 客户中台</title>
<style>
/* ========== LC-OMS Token（与 shell 共享）========== */
:root{
  --primary:#1677ff; --primary-hover:#4096ff; --primary-active:#0958d9;
  --primary-bg:rgba(22,119,255,0.06); --primary-border:rgba(22,119,255,0.24);
  --success:#52c41a; --warning:#faad14; --danger:#ff4d4f;
  --bg:#f5f7fa; --surface:#fff;
  --border:#e5e6eb; --border-light:#f0f0f0;
  --text:#1d2129; --text-secondary:#4e5969; --text-tertiary:#86909c;
  --text-quaternary:#c9cdd4;
  --radius-sm:4px; --radius-md:6px; --radius-lg:8px;
  --shadow-card:0 1px 2px rgba(0,0,0,.03),0 1px 6px -1px rgba(0,0,0,.02),0 2px 4px rgba(0,0,0,.02);
  --shadow-dropdown:0 6px 16px rgba(0,0,0,.08),0 3px 6px -3px rgba(0,0,0,.12),0 -5px 12px rgba(0,0,0,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5715;color:var(--text);background:var(--bg)}

/* ========== 页面容器（无 Header，壳层提供）========== */
.app-container{max-width:1400px;margin:0 auto;padding:16px 24px;position:relative;display:flex;gap:20px;align-items:flex-start}

/* ========== 左侧：品类树面板 ========== */
.tree-panel{width:280px;flex-shrink:0;background:var(--surface);border:1px solid var(--border-light);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 88px)}
/* 树顶栏：搜索 + 重置 + ⋮菜单 */
.tree-header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border-light);background:#fafbfc;flex-shrink:0}
.tree-search-wrap{position:relative;flex:1;min-width:0}
.tree-search{height:32px;border:1px solid var(--border);border-radius:var(--radius-md);padding:0 46px 0 11px;width:100%;font-size:13.5px;outline:none;background:var(--surface);color:var(--text);transition:border-color .2s,box-shadow .2s}
.tree-search:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-bg)}
.tree-search::placeholder{color:var(--text-quaternary);font-size:13.5px}
.tree-search-clear{position:absolute;right:28px;top:50%;transform:translateY(-50%);width:18px;height:18px;border:none;border-radius:50%;background:var(--bg);display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .15s,color .15s;color:var(--text-tertiary);padding:0;line-height:1;z-index:1}
.tree-search-wrap:hover .tree-search-clear{opacity:1}
.tree-search-clear:hover{background:#e8eaed;color:var(--text-secondary)}
.tree-search-clear svg{width:10px;height:10px}
.tree-search-icon{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:18px;height:18px;border:none;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--text-tertiary);padding:0;line-height:1;transition:color .15s}
.tree-search-icon:hover{color:var(--primary)}
.tree-search-icon svg{width:14px;height:14px}
.tree-reset-btn{height:30px;padding:0 12px;background:var(--primary);color:#fff;border:1px solid var(--primary);border-radius:var(--radius-sm);font-size:13px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .2s}
.tree-reset-btn:hover{background:var(--primary-hover)}
/* ⋮ 菜单 */
.tree-more{position:relative;flex-shrink:0}
.tree-more-btn{width:28px;height:30px;border:none;background:transparent;cursor:pointer;display:grid;place-items:center;border-radius:var(--radius-sm);transition:background .15s,color:.15s;color:var(--text-tertiary);padding:0}
.tree-more-btn:hover{background:var(--bg);color:var(--text-secondary)}
.tree-more-dot{display:flex;flex-direction:column;gap:3px;align-items:center}
.tree-more-dot span{width:3px;height:3px;border-radius:50%;background:currentColor}
.tree-dropdown{position:absolute;top:calc(100% + 4px);right:0;min-width:100px;background:var(--surface);border:1px solid var(--border-light);border-radius:var(--radius-md);box-shadow:var(--shadow-dropdown);z-index:200;display:none;overflow:hidden}
.tree-dropdown.show{display:block}
.tree-dd-item{display:flex;align-items:center;gap:6px;padding:8px 14px;font-size:13px;color:var(--text);cursor:pointer;transition:background .15s;white-space:nowrap}
.tree-dd-item:hover{background:var(--bg)}

/* 树列表 */
.tree-body{flex:1;overflow-y:auto;padding:6px 0}
.tree-item{user-select:none}
.tree-row{display:flex;align-items:center;gap:4px;padding:5px 10px;cursor:pointer;border-radius:var(--radius-sm);transition:background .15s;font-size:13.5px;color:var(--text);line-height:1.6}
.tree-row:hover{background:var(--bg)}
.tree-row.active{background:var(--primary-bg);color:var(--primary)}
.tree-arrow{width:18px;height:18px;flex-shrink:0;display:grid;place-items:center;cursor:pointer;border-radius:2px;transition:transform .15s,color:.15s;color:var(--text-tertiary);padding:0}
.tree-arrow:hover{color:var(--text-secondary);background:var(--bg)}
.tree-arrow svg{width:12px;height:12px;transition:transform .15s}
.tree-arrow.expanded svg{transform:rotate(90deg)}
.tree-arrow.leaf{visibility:hidden;pointer-events:none}
.tree-label{flex:1;overflow:hidden;text-white-space:nowrap;text-overflow:ellipsis}
.tree-children{display:none;padding-left:18px}
.tree-children.expanded{display:block}

/* ========== 右侧：搜索区 + 详情卡片 ========== */
.right-panel{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}

/* 搜索区 */
.filter-bar{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:14px 20px;box-shadow:var(--shadow-card)}
.filter-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
/* 输入框容器（含右侧 × 清除 + 🔍 搜索图标）—— 与商品管理页统一 */
.input-wrap{position:relative;flex-shrink:0}
.input-wrap .f-input{padding-right:46px;width:100%}
.f-input{height:32px;border:1px solid var(--border);border-radius:var(--radius-md);padding:0 11px;min-width:80px;font-size:13.5px;outline:none;background:#fff;color:var(--text);transition:border-color .2s,box-shadow .2s}
.f-input:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-bg)}
.f-input::placeholder{color:var(--text-quaternary);font-size:13.5px}
/* 输入框内清除按钮（hover 显示，位于搜索图标左侧） */
.input-clear{position:absolute;right:28px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;border:none;background:var(--bg);display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .15s;color:var(--text-tertiary);padding:0;line-height:1;z-index:1}
.input-wrap:hover .input-clear{opacity:1}
.input-clear:hover{background:#e8eaed;color:var(--text-secondary)}
.input-clear svg{width:10px;height:10px}
/* 输入框内搜索图标（常显，最右侧） */
.input-search{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-quaternary);pointer-events:none;display:block}
.input-search svg{width:14px;height:14px}
.f-select{height:32px;border:1px solid var(--border);border-radius:var(--radius-md);padding:0 26px 0 10px;min-width:130px;font-size:13.5px;outline:none;background:#fff;color:var(--text);cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%231d2129' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;background-size:14px}
.f-select option{color:var(--text)}
.f-select option[value=""]{color:var(--text-quaternary)}
.f-date{height:32px;border:1px solid var(--border);border-radius:var(--radius-md);padding:0 10px;min-width:130px;font-size:13.5px;outline:none;background:#fff;color:var(--text);cursor:pointer}
.f-date::placeholder{color:var(--text-quaternary);font-size:13.5px}
/* 下拉框：未选（提示词）浅灰，选中具体内容后黑色（LC-OMS 铁律） */
.f-select:not(:has(option:checked:not([value=""]))){color:var(--text-quaternary)}
/* ---------- 通用自定义下拉（真实 DOM 内联 SVG 三角，不依赖 background-image） ----------
   原生 select 的 appearance:none + background-image 方案在部分浏览器不渲染箭头，
   故所有下拉统一改用本组件：.f-select.dd = div + .dd-label + .dd-arrow(内联SVG) + .dd-list */
.f-select.dd{position:relative;display:inline-flex;align-items:center;justify-content:space-between;gap:6px;height:32px;padding:0 10px;min-width:130px;border:1px solid var(--border);border-radius:var(--radius-md);background:#fff;cursor:pointer;user-select:none;font-size:13.5px;flex-shrink:0;transition:border-color .2s}
.f-select.dd:hover{border-color:var(--primary)}
.f-select.dd.open{border-color:var(--primary)}
.f-select.dd .dd-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-quaternary)}
.f-select.dd.has-value .dd-label{color:var(--text)}
/* 三角箭头：中等深度灰，点击展开旋转 180° 变蓝（LC-OMS 铁律） */
.f-select.dd .dd-arrow{display:grid;place-items:center;color:#4e5969;transition:transform .15s,color .15s;flex-shrink:0}
.f-select.dd .dd-arrow svg{width:12px;height:12px;display:block}
.f-select.dd.open .dd-arrow{transform:rotate(180deg);color:var(--primary)}
.btn-default{height:32px;padding:0 12px;background:#fff;color:var(--text-secondary);border:1px solid var(--border);border-radius:var(--radius-md);font-size:13.5px;cursor:pointer;transition:border-color .2s,color .2s;white-space:nowrap;flex-shrink:0}
.btn-default:hover{border-color:var(--primary);color:var(--primary)}

/* ---------- 创建时间合并式：下拉框(右直角) + 日期范围(左直角) 紧贴成一条边框 ---------- */
.date-combo{position:relative;flex-shrink:0;display:inline-flex}
.dc-select{border:1px solid var(--border);border-radius:var(--radius-md) 0 0 var(--radius-md);min-width:92px;color:var(--text)}
/* 创建时间自定义下拉框：清晰下三角，点击展开变向上蓝三角（LC-OMS 铁律） */
.dc-select.dd{position:relative;display:inline-flex;align-items:center;justify-content:space-between;gap:6px;height:32px;padding:0 10px;background:#fff;cursor:pointer;user-select:none;font-size:13.5px}
.dd-arrow{display:grid;place-items:center;color:var(--text-tertiary);transition:transform .15s,color .15s;flex-shrink:0}
.dd-arrow svg{width:12px;height:12px;display:block}
.dc-select.dd.open .dd-arrow{transform:rotate(180deg);color:var(--primary)}
.dd-list{position:absolute;top:calc(100% + 4px);left:0;min-width:100%;background:#fff;border:1px solid var(--border-light);border-radius:var(--radius-md);box-shadow:var(--shadow-dropdown);z-index:310;display:none;overflow:hidden;padding:4px 0}
.dc-select.dd.open .dd-list,.f-select.dd.open .dd-list{display:block}
.dd-item{padding:7px 14px;font-size:13.5px;color:var(--text);cursor:pointer;white-space:nowrap;transition:background .15s}
.dd-item:hover{background:var(--bg)}
.dd-item.active{color:var(--primary);background:var(--primary-bg)}
.dc-range{display:inline-flex;align-items:center;gap:4px;height:32px;border:1px solid var(--border);border-radius:0 var(--radius-md) var(--radius-md) 0;background:#fff;padding:0 6px 0 10px;margin-left:-7px;transition:border-color .2s,box-shadow .2s}
.date-combo.open .dc-range,.dc-range:focus-within{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-bg)}
/* 宽度=提示词略长：flex-basis 58px ≈ "开始日期"54px+4px 余量；选中日期后由 JS 按内容自适应加宽 */
.dc-seg{flex:0 0 58px;min-width:0;border:none;outline:none;background:transparent;font-size:13.5px;color:var(--text);padding:0;text-align:center;cursor:pointer}
.dc-seg::placeholder{color:var(--text-quaternary);font-size:13.5px}
.dc-arrow{color:var(--text-tertiary);font-size:13px;flex-shrink:0;user-select:none}
/* 日历图标仅为视觉标识，整框可点 */
.dc-cal{width:16px;height:16px;color:var(--text-tertiary);flex-shrink:0;display:grid;place-items:center}
.dc-cal svg{width:14px;height:14px}

/* ---------- 下拉框：展开时箭头向上（蓝色），选项列表不含提示词项（hidden option） ---------- */
.f-select{transition:background-image .15s}
.f-select.sel-open{background-image:url("data:image/svg+xml,%3Csvg width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%231677ff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 15l6-6 6 6'/%3E%3C/svg%3E")!important;border-color:var(--primary)}

/* ---------- 日期面板：顶部时间行 + 底部清空/确定 + 时间滚动选择 ---------- */
.dp-times{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:nowrap}
.dp-pair{display:flex;align-items:center;gap:6px;flex:none}
.dpt-date{flex:none;width:106px;height:30px;border:1px solid var(--border);border-radius:var(--radius-sm);text-align:center;font-size:13px;color:var(--text);background:#fff;outline:none}
.dpt-date::placeholder{color:var(--text-quaternary)}
.dpt-time{flex:none;width:82px;height:30px;border:1px solid var(--border);border-radius:var(--radius-sm);text-align:center;font-size:13px;color:var(--text);background:#fff;outline:none;cursor:pointer}
.dpt-time::placeholder{color:var(--text-quaternary)}
.dpt-time:focus,.dpt-time:hover{border-color:var(--primary)}
.dpt-arrow{color:var(--text-tertiary);flex-shrink:0}
.dp-body{display:flex;gap:20px}
.dp-foot{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-light)}
.dp-btn-clear{border:none;background:none;color:var(--primary);font-size:13px;cursor:pointer;padding:4px 6px}
.dp-btn-clear:hover{color:var(--primary-hover)}
.dp-btn-ok{height:28px;padding:0 18px;background:var(--primary);color:#fff;border:1px solid var(--primary);border-radius:var(--radius-md);font-size:13px;cursor:pointer;transition:background .2s}
.dp-btn-ok:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
/* 时间滚动选择（时/分/秒） */
/* 时间滚动选择：参照 Element 风格——选中项加粗黑字+浅色带（非蓝底白字），取消/确定横排右下 */
.time-pop{position:absolute;z-index:320;background:#fff;border:1px solid var(--border-light);border-radius:var(--radius-md);box-shadow:var(--shadow-dropdown);padding:10px;display:none;flex-direction:column;gap:8px}
.time-pop.open{display:flex}
.tp-body{display:flex;gap:4px}
.tp-col{width:48px;height:182px;overflow-y:auto;border-radius:4px;scrollbar-width:thin}
.tp-col::-webkit-scrollbar{width:4px}
.tp-col::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.tp-item{height:26px;line-height:26px;text-align:center;font-size:13px;cursor:pointer;color:var(--text);border-radius:4px}
.tp-item:hover{background:var(--bg)}
.tp-item.sel{font-weight:600;color:var(--text);background:var(--bg)}
.tp-foot{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.tp-btn-cancel{height:26px;padding:0 10px;background:#fff;color:var(--text-secondary);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;cursor:pointer;writing-mode:horizontal-tb;white-space:nowrap}
.tp-btn-ok{height:26px;padding:0 10px;background:var(--primary);color:#fff;border:1px solid var(--primary);border-radius:var(--radius-sm);font-size:12px;cursor:pointer;white-space:nowrap}

/* ---------- 左右双月日历面板：两次点击完成（开始→结束） ---------- */
.date-panel{position:absolute;top:calc(100% + 4px);left:0;z-index:300;background:#fff;border:1px solid var(--border-light);border-radius:var(--radius-lg);box-shadow:var(--shadow-dropdown);display:none;padding:12px 14px;min-width:480px}
/* 【铁律】面板必须保持 absolute 覆盖层——严禁 position:relative（会让面板进入文档流，撑宽组合框+推动下方内容产生大空白） */
.date-panel.open{display:block}
.dp-month{min-width:232px}
.dp-title{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:600;color:var(--text);padding-bottom:8px}
.dp-title button{border:none;background:transparent;cursor:pointer;color:var(--text-tertiary);width:22px;height:22px;border-radius:4px;display:grid;place-items:center;padding:0;font-size:14px}
.dp-title button:hover{background:var(--bg);color:var(--text)}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:12.5px;text-align:center}
.dp-wk{color:var(--text-tertiary);padding:4px 0}
.dp-day{height:26px;line-height:26px;border-radius:4px;cursor:pointer;color:var(--text)}
.dp-day:hover{background:var(--bg)}
.dp-day.dim{color:var(--text-quaternary);pointer-events:none}
.dp-day.in-range{background:var(--primary-bg);border-radius:0}
.dp-day.start,.dp-day.end{background:var(--primary);color:#fff}

/* 详情卡片 */
.detail-card{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:20px 24px;position:relative}
/* 详情卡片右上角状态角标（LC-OMS §七）：只露左下边框；启用=浅绿 / 禁止=淡红（同色系浅底浅边） */
.detail-card .row-status{position:absolute;top:-1px;right:-1px;z-index:1;font-size:12px;line-height:1.6;padding:2px 10px;border-left:1px solid transparent;border-bottom:1px solid transparent;border-bottom-left-radius:var(--radius-sm);white-space:nowrap}
.detail-card .row-status.status-on{color:#52c41a;background:rgba(82,196,26,.07);border-left-color:rgba(82,196,26,.32);border-bottom-color:rgba(82,196,26,.32)}
.detail-card .row-status.status-off{color:#ff4d4f;background:rgba(255,77,79,.07);border-left-color:rgba(255,77,79,.3);border-bottom-color:rgba(255,77,79,.3)}
/* 卡片外列标题条 = 表头风格（LC-OMS §五/§五·补2）：#fafbfc 底、13/500/secondary、无边框；与下方卡片对齐 */
.detail-card-head{display:flex;gap:40px;padding:12px 24px;background:#fafbfc;border-radius:var(--radius-lg) var(--radius-lg) 0 0;margin-bottom:-16px}
.detail-card-head .card-head-cell{font-size:13px;font-weight:500;color:var(--text-secondary);flex:1;min-width:0}
/* 字段卡堆叠：一个下级一张卡，卡间距 16px */
.card-stack{display:flex;flex-direction:column;gap:16px}
/* 卡片标题条 = 表头风格：#fafbfc 背景横贯全宽，三格与下方三列对齐（同 gap/flex） */
.card-head-row{display:flex;gap:40px;background:#fafbfc;margin:-20px -24px 16px;padding:12px 24px;border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.card-head-cell{flex:1;min-width:0;font-size:13px;font-weight:500;color:var(--text-secondary)}
.card-cols{display:flex;gap:40px}
.card-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.field{display:flex;align-items:baseline;line-height:1.9;font-size:12.5px;color:var(--text-tertiary)}
/* LC-OMS 铁律：标签右对齐 + 固定宽度 = 冒号垂直成线；最长标签左缘严格贴齐列标题左缘（无 padding 偏移） */
.field .f-label{flex:0 0 5em;text-align:right;white-space:nowrap;color:var(--text-tertiary)}
.field .f-val{flex:1;min-width:0;color:var(--text-tertiary);word-break:break-all}
/* 三列标签宽度 = 该列最长字段名（含冒号，CJK+全角冒号≈1em/字）：
   中文名称：/英文名称：/品类等级：/父级品类：/创建日期： 均=5字 → 5em（创建人：=4字亦含入） */
.card-col:nth-child(1) .f-label{flex-basis:5em}
.card-col:nth-child(2) .f-label{flex-basis:5em}
.card-col:nth-child(3) .f-label{flex-basis:5em}

/* 空状态 */
.empty-hint{text-align:center;padding:60px 20px;color:var(--text-tertiary);font-size:14px}
.empty-hint .empty-icon{font-size:48px;margin-bottom:12px;opacity:.35}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0!important;transition-duration:0!important}}
</style>
</head>
<body>

<div class="app-container" id="appContainer">

<!-- ===== 左侧：品类树 ===== -->
<div class="tree-panel">
  <div class="tree-header">
    <div class="tree-search-wrap">
      <input class="tree-search" id="treeSearch" placeholder="请输入关键字" />
      <button class="tree-search-clear" aria-label="清除" onclick="var i=document.getElementById('treeSearch');i.value='';i.focus()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      <button class="tree-search-icon" aria-label="搜索"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></button>
    </div>
    <button class="tree-reset-btn" onclick="resetTree()">重置</button>
    <div class="tree-more">
      <button class="tree-more-btn" onclick="toggleTreeMenu()" title="更多操作">
        <div class="tree-more-dot"><span></span><span></span><span></span></div>
      </button>
      <div class="tree-dropdown" id="treeDropdown">
        <div class="tree-dd-item" onclick="expandAll()">展开全部</div>
        <div class="tree-dd-item" onclick="collapseAll()">折叠全部</div>
      </div>
    </div>
  </div>
  <div class="tree-body" id="treeBody">
    <!-- 树由 JS 渲染 -->
  </div>
</div>

<!-- ===== 右侧：搜索 + 详情卡片 ===== -->
<div class="right-panel">

  <!-- 搜索栏 -->
  <div class="filter-bar">
    <div class="filter-row">
      <div class="input-wrap" style="width:220px">
        <input class="f-input" placeholder="请输入中文名称" />
        <button class="input-clear" aria-label="清除" onclick="this.previousElementSibling.value='';this.style.opacity='0'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        <span class="input-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
      </div>
      <div class="f-select dd" id="selLevel" data-placeholder="请选择品类等级">
        <span class="dd-label">请选择品类等级</span>
        <span class="dd-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
        <div class="dd-list">
          <div class="dd-item" data-v="1">一级品类</div>
          <div class="dd-item" data-v="2">二级品类</div>
          <div class="dd-item" data-v="3">三级品类</div>
        </div>
      </div>
      <div class="f-select dd" id="selStatus" data-placeholder="请选择状态">
        <span class="dd-label">请选择状态</span>
        <span class="dd-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
        <div class="dd-list">
          <div class="dd-item" data-v="active">启用</div>
          <div class="dd-item" data-v="inactive">禁用</div>
        </div>
      </div>
      <!-- 创建时间：下拉框 + 日期范围合并式（LC-OMS 合并风格，两者永不分开） -->
      <div class="date-combo" id="dateCombo">
        <div class="dc-select dd has-value" id="dcType" data-placeholder="创建时间">
          <span class="dd-label">创建时间</span>
          <span class="dd-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
          <div class="dd-list">
            <div class="dd-item active" data-v="创建时间">创建时间</div>
          </div>
        </div>
        <div class="dc-range" id="dcRange" onclick="toggleDatePanel(event)" title="点击选择日期范围">
          <input class="dc-seg" id="drStart" placeholder="开始日期" readonly />
          <span class="dc-arrow">→</span>
          <input class="dc-seg" id="drEnd" placeholder="结束日期" readonly />
          <span class="dc-cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
        </div>
        <!-- 日期范围面板：顶部时间行 + 左右双月 + 清空/确定 -->
        <div class="date-panel" id="datePanel" onclick="event.stopPropagation()">
          <div class="dp-times">
            <div class="dp-pair">
              <input class="dpt-date" id="dtStartDate" readonly placeholder="开始日期" />
              <input class="dpt-time" id="dtStartTime" readonly placeholder="开始时间" onclick="openTimePop(this)" />
            </div>
            <span class="dpt-arrow">›</span>
            <div class="dp-pair">
              <input class="dpt-date" id="dtEndDate" readonly placeholder="结束日期" />
              <input class="dpt-time" id="dtEndTime" readonly placeholder="结束时间" onclick="openTimePop(this)" />
            </div>
          </div>
          <div class="dp-body" id="dpBody">
            <div class="dp-month">
              <div class="dp-title"><button type="button" onclick="dpNav(-1)">‹</button><span id="dpLeftTitle"></span><button type="button" style="visibility:hidden">‹</button></div>
              <div class="dp-grid" id="dpLeftGrid"></div>
            </div>
            <div class="dp-month">
              <div class="dp-title"><button type="button" style="visibility:hidden">‹</button><span id="dpRightTitle"></span><button type="button" onclick="dpNav(1)">›</button></div>
              <div class="dp-grid" id="dpRightGrid"></div>
            </div>
          </div>
          <div class="dp-foot">
            <button type="button" class="dp-btn-clear" onclick="dpClear()">清空</button>
            <button type="button" class="dp-btn-ok" onclick="dpConfirm()">确定</button>
          </div>
          <!-- 时间滚动选择（时/分/秒 三列 + 取消/确定） -->
          <div class="time-pop" id="timePop">
            <div class="tp-body">
              <div class="tp-col" id="tpH"></div>
              <div class="tp-col" id="tpM"></div>
              <div class="tp-col" id="tpS"></div>
            </div>
            <div class="tp-foot">
              <button type="button" class="tp-btn-cancel" onclick="closeTimePop(false)">取消</button>
              <button type="button" class="tp-btn-ok" onclick="closeTimePop(true)">确定</button>
            </div>
          </div>
        </div>
      </div>
      <button class="btn-default" onclick="resetFilters()">重置</button>
    </div>
  </div>

  <!-- 三列标题行：置于卡片外（不入卡，参照仓库商品页结构），与卡片内字段列左右对齐 -->
  <div class="detail-card-head">
    <div class="card-head-cell">品类名称</div>
    <div class="card-head-cell">品类结构</div>
    <div class="card-head-cell">创建信息</div>
  </div>
  <!-- 字段卡片区：点父级显示其全部直接下级，每个下级一张字段卡片（含右上角状态角标） -->
  <div class="card-stack" id="cardStack"></div>

</div><!-- /right-panel -->

</div><!-- /appContainer -->

<script>
/* ========== 品类数据（三级树）========== */
var categoryData = [
  {id:'m1',name:'摩托车&摩托车配件',children:[
    {id:'m1-1',name:'摩托车配件',children:[
      {id:'m1-1-1',name:'通用支架'},
      {id:'m1-1-2',name:'支架垫板'},
      {id:'m1-1-3',name:'赛车计时器/计圈器'},
      {id:'m1-1-4',name:'摩托车后视镜'}
    ]}
  ]},
  {id:'m2',name:'婴儿用品'},
  {id:'m3',name:'数码相机/摄像机'},
  {id:'m4',name:'商业及工业'},
  {id:'m5',name:'手机与配件'},
  {id:'m6',name:'服装，鞋类及配件'},
  {id:'m7',name:'计算机/平板电脑/网络设备'},
  {id:'m8',name:'消费性电子产品'},
  {id:'m9',name:'健康与美容'},
  {id:'m10',name:'家居与园艺'},
  {id:'m11',name:'珠宝与手表'},
  {id:'m12',name:'乐器'},
  {id:'m13',name:'宠物用品'},
  {id:'m14',name:'体育运动/健身/户外'},
  {id:'m15',name:'玩具/动漫/模型/毛绒'},
  {id:'m16',name:'旅行'},
  {id:'m17',name:'汽车，汽车配件',children:[
    {id:'m17-1',name:'无ID'}
  ]},
  {id:'m18',name:'others ID'},
  {id:'m19',name:'画画用品'},
  {id:'m20',name:'布兰德'},
  {id:'m21',name:'空气清新剂'},
  {id:'m22',name:'文具用品'},
  {id:'m23',name:'配件'},
  {id:'m24',name:'食品机械'}
];

/* 模拟详情数据（点击树节点时填充） */
var detailData = {
  'm1': {cn:'摩托车&摩托车配件',en:'Motorcycle & Parts',level:'一级品类',parent:'—',creator:'系统管理员',date:'2025-01-15'},
  'm1-1':{cn:'摩托车配件',en:'Motorcycle Parts',level:'二级品类',parent:'摩托车&摩托车配件',creator:'张三',date:'2025-02-03'},
  /* 摩托车配件下的四个三级品类：右上角状态示例（启用=浅绿 / 禁止=淡红） */
  'm1-1-1':{cn:'通用支架',en:'Universal Bracket',level:'三级品类',parent:'摩托车配件',creator:'张三',date:'2025-03-02',status:'启用'},
  'm1-1-2':{cn:'支架垫板',en:'Bracket Pad',level:'三级品类',parent:'摩托车配件',creator:'张三',date:'2025-03-02',status:'启用'},
  'm1-1-3':{cn:'赛车计时器/计圈器',en:'Racing Timer / Lap Counter',level:'三级品类',parent:'摩托车配件',creator:'李四',date:'2025-03-05',status:'禁止'},
  'm1-1-4':{cn:'摩托车后视镜',en:'Motorcycle Rearview Mirror',level:'三级品类',parent:'摩托车配件',creator:'王五',date:'2025-03-08',status:'禁止'},
  'm2': {cn:'婴儿用品',en:'Baby Products',level:'一级品类',parent:'—',creator:'李四',date:'2025-02-10'},
};

/* 当前选中 */
var currentId = null;

/* ========== 树渲染 ========== */
function renderTree(items, container, level){
  items.forEach(function(item){
    var hasChildren = item.children && item.children.length > 0;
    var div = document.createElement('div');
    div.className = 'tree-item';
    div.dataset.id = item.id;

    var row = document.createElement('div');
    row.className = 'tree-row';
    row.dataset.id = item.id;
    row.onclick=function(e){ e.stopPropagation(); if(level===0 && item.id!=='m1') return; selectNode(item.id); };

    // 箭头（一级品类恒显示朝右箭头作为展开语义；不为其新增二级示例，无子级时点击无副作用）
    var arrow = document.createElement('span');
    var expandable = hasChildren || level === 0;
    arrow.className = 'tree-arrow' + (expandable ? '' : ' leaf');
    if(expandable) arrow.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
    arrow.onclick=function(e){ e.stopPropagation(); toggleNode(item.id); };

    // 标签
    var label = document.createElement('span');
    label.className = 'tree-label';
    label.textContent = item.name;

    row.appendChild(arrow);
    row.appendChild(label);
    div.appendChild(row);

    // 子节点容器
    if(hasChildren){
      var childWrap = document.createElement('div');
      childWrap.className = 'tree-children';
      childWrap.id = 'children-'+item.id;
      renderTree(item.children, childWrap, level+1);
      div.appendChild(childWrap);
    }
    container.appendChild(div);
  });
}

function toggleNode(id){
  var wrap = document.getElementById('children-'+id);
  var item = document.querySelector('.tree-row[data-id="'+id+'"]');
  var arrow = item ? item.querySelector('.tree-arrow') : null;
  if(wrap){
    var exp = wrap.classList.toggle('expanded');
    if(arrow) arrow.classList.toggle('expanded', exp);
  }
}

function findTreeNode(id, items){
  items = items || categoryData;
  for(var i = 0; i < items.length; i++){
    if(items[i].id === id) return items[i];
    if(items[i].children){
      var r = findTreeNode(id, items[i].children);
      if(r) return r;
    }
  }
  return null;
}

function escTxt(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* 渲染字段卡：点击项有下级 → 每个下级一张字段卡（展示全部）；叶子（如三级品类）→ 保留标题与卡片，卡片内删除字段/数据并显示“暂无数据” */
function renderCards(id){
  var stack = document.getElementById('cardStack');
  if(!stack) return;
  stack.innerHTML = '';
  var node = id ? findTreeNode(id) : null;
  if(!node) return;
  var kids = (node.children && node.children.length) ? node.children : null;
  if(!kids){
    var ecard = document.createElement('div');
    ecard.className = 'detail-card';
    var hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.textContent = '暂无数据';
    ecard.appendChild(hint);
    stack.appendChild(ecard);
    return;
  }
  kids.forEach(function(it){
    var d = detailData[it.id] || {};
    var card = document.createElement('div');
    card.className = 'detail-card';
    if(d.status){
      var st = document.createElement('span');
      st.className = 'row-status status-' + (d.status === '启用' ? 'on' : 'off');
      st.textContent = d.status;
      card.appendChild(st);
    }
    var cols = document.createElement('div');
    cols.className = 'card-cols';
    function row(label, val){
      return '<div class="field"><span class="f-label">' + label + '</span><span class="f-val">' + escTxt(val) + '</span></div>';
    }
    cols.innerHTML =
      '<div class="card-col">' + row('中文名称：', d.cn || '—') + row('英文名称：', d.en || '—') + '</div>' +
      '<div class="card-col">' + row('品类等级：', d.level || '—') + row('父级品类：', d.parent || '—') + '</div>' +
      '<div class="card-col">' + row('创建人：', d.creator || '—') + row('创建日期：', d.date || '—') + '</div>';
    card.appendChild(cols);
    stack.appendChild(card);
  });
}

function selectNode(id){
  // 高亮当前行
  document.querySelectorAll('.tree-row.active').forEach(function(r){ r.classList.remove('active'); });
  var row = document.querySelector('.tree-row[data-id="'+id+'"]');
  if(row) row.classList.add('active');
  currentId = id;
  renderCards(id);
}

/* ========== 树操作 ========== */
function expandAll(){
  document.querySelectorAll('.tree-children').forEach(function(el){ el.classList.add('expanded'); });
  document.querySelectorAll('.tree-arrow:not(.leaf)').forEach(function(el){ el.classList.add('expanded'); });
}
function collapseAll(){
  document.querySelectorAll('.tree-children').forEach(function(el){ el.classList.remove('expanded'); });
  document.querySelectorAll('.tree-arrow:not(.leaf)').forEach(function(el){ el.classList.remove('expanded'); });
}
function resetTree(){
  document.getElementById('treeSearch').value = '';
  collapseAll();
  currentId = null;
  document.querySelectorAll('.tree-row.active').forEach(function(r){ r.classList.remove('active'); });
  renderCards(null);
}
function toggleTreeMenu(){
  document.getElementById('treeDropdown').classList.toggle('show');
}
function resetFilters(){
  var inputs = document.querySelectorAll('.filter-bar .f-input');
  inputs.forEach(function(i){ i.value = ''; });
  // 自定义下拉复位：标签回提示词、清选中态与 active（创建时间下拉保持"创建时间"默认值，一并复位）
  var sels = document.querySelectorAll('.filter-bar .dd');
  sels.forEach(function(d){
    var ph = d.dataset.placeholder;
    var label = d.querySelector('.dd-label');
    if(ph && label) label.textContent = ph;
    d.classList.remove('has-value','open');
    delete d.dataset.value;
    d.querySelectorAll('.dd-item').forEach(function(n){ n.classList.remove('active'); });
  });
  // 日期组合框复位
  dpStart = dpEnd = dpHover = null;
  var drS = document.getElementById('drStart'), drE = document.getElementById('drEnd');
  drS.value = ''; drS.style.flexBasis = '';
  drE.value = ''; drE.style.flexBasis = '';
  document.getElementById('dtStartDate').value = '';
  document.getElementById('dtEndDate').value = '';
  document.getElementById('dtStartTime').value = '';
  document.getElementById('dtEndTime').value = '';
  closeDatePanel();
  closeTimePop(false, true);
}

/* ========== 创建时间：日期范围面板（整框可点 / 粘连选择 / 时分秒 / 清空·确定） ========== */
var dpStart = null, dpEnd = null, dpHover = null;
var dpLeft = null, dpRight = null;   // 两个面板当前月份（Date，1号）
var WK = ['日','一','二','三','四','五','六'];

function pad(n){ return (n<10?'0':'')+n; }
function fmt(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

function toggleDatePanel(e){
  if(e) e.stopPropagation();
  var panel = document.getElementById('datePanel');
  var combo = document.getElementById('dateCombo');
  var open = panel.classList.toggle('open');
  combo.classList.toggle('open', open);
  if(open){
    closeTimePop(false, true);
    var today = new Date();
    if(!dpLeft){
      dpLeft = new Date(today.getFullYear(), today.getMonth(), 1);
      dpRight = new Date(today.getFullYear(), today.getMonth()+1, 1);
    }
    renderDp();
  }
}
function closeDatePanel(){
  document.getElementById('datePanel').classList.remove('open');
  document.getElementById('dateCombo').classList.remove('open');
  dpHover = null;
  closeTimePop(false, true);
}
function dpNav(dir){
  dpLeft = new Date(dpLeft.getFullYear(), dpLeft.getMonth()+dir, 1);
  dpRight = new Date(dpRight.getFullYear(), dpRight.getMonth()+dir, 1);
  renderDp();
}
function renderDp(){
  document.getElementById('dpLeftTitle').textContent = dpLeft.getFullYear()+' 年 '+(dpLeft.getMonth()+1)+' 月';
  document.getElementById('dpRightTitle').textContent = dpRight.getFullYear()+' 年 '+(dpRight.getMonth()+1)+' 月';
  document.getElementById('dpLeftGrid').innerHTML = dpGridHtml(dpLeft);
  document.getElementById('dpRightGrid').innerHTML = dpGridHtml(dpRight);
  // 同步顶部时间行中的日期；选了具体日期后时分秒显示默认值，未选时显示灰色提示词
  document.getElementById('dtStartDate').value = dpStart ? fmt(dpStart) : '';
  document.getElementById('dtEndDate').value = dpEnd ? fmt(dpEnd) : '';
  var st = document.getElementById('dtStartTime'), et = document.getElementById('dtEndTime');
  if(dpStart){ if(!st.value) st.value = '00:00:00'; } else { st.value = ''; }
  if(dpEnd){ if(!et.value) et.value = '23:59:59'; } else { et.value = ''; }
}
function dpGridHtml(month){
  var html = WK.map(function(w){ return '<span class="dp-wk">'+w+'</span>'; }).join('');
  var first = new Date(month.getFullYear(), month.getMonth(), 1);
  var days = new Date(month.getFullYear(), month.getMonth()+1, 0).getDate();
  for(var i=0;i<first.getDay();i++){ html += '<span class="dp-day dim"></span>'; }
  var hoverEnd = (dpStart && !dpEnd && dpHover && dpHover>=dpStart.getTime()) ? dpHover : null;
  for(var d=1;d<=days;d++){
    var cur = new Date(month.getFullYear(), month.getMonth(), d);
    var cls = 'dp-day', t = cur.getTime();
    var lo = dpStart ? dpStart.getTime() : null;
    var hi = dpEnd ? dpEnd.getTime() : hoverEnd;
    if(lo!==null && hi!==null && t>lo && t<hi) cls += ' in-range';
    if(dpEnd && t===dpEnd.getTime()) cls += ' end';
    if(dpStart && t===lo) cls += ' start';
    html += '<span class="'+cls+'" data-t="'+t+'" onclick="dpPick('+t+')" onmouseover="dpHoverDay('+t+')">'+d+'</span>';
  }
  return html;
}
/* 粘连选择：选了开始未选结束时，鼠标滑过即预览区间 */
function dpHoverDay(t){
  if(dpStart && !dpEnd && t>=dpStart.getTime()){
    if(dpHover !== t){ dpHover = t; renderDp(); }
  }
}
function dpPick(t){
  var picked = new Date(t);
  if(!dpStart || (dpStart && dpEnd)){
    dpStart = picked; dpEnd = null; dpHover = null;
  }else if(t >= dpStart.getTime()){
    dpEnd = picked; dpHover = null;
  }else{
    dpStart = picked; dpEnd = null; dpHover = null;
  }
  renderDp();
}
function dpConfirm(){
  if(!dpStart){ closeDatePanel(); return; }
  if(!dpEnd) dpEnd = dpStart;
  var st = document.getElementById('dtStartTime').value || '00:00:00';
  var et = document.getElementById('dtEndTime').value || '23:59:59';
  var s = document.getElementById('drStart'), e2 = document.getElementById('drEnd');
  s.value = fmt(dpStart)+' '+st;
  e2.value = fmt(dpEnd)+' '+et;
  // 宽度自适应内容："2026-09-01 00:00:00"=19字符 ≈ 7.2px/字 + 10px 余量；空值时回落到 58px 提示词宽度
  s.style.flexBasis = (Math.round(s.value.length*7.2)+10)+'px';
  e2.style.flexBasis = (Math.round(e2.value.length*7.2)+10)+'px';
  closeDatePanel();
}
function dpClear(){
  dpStart = dpEnd = dpHover = null;
  var s = document.getElementById('drStart'), e2 = document.getElementById('drEnd');
  s.value = ''; s.style.flexBasis = '';
  e2.value = ''; e2.style.flexBasis = '';
  document.getElementById('dtStartTime').value = '';
  document.getElementById('dtEndTime').value = '';
  renderDp();
}

/* ========== 时间滚动选择（时/分/秒 三列 + 取消/确定） ========== */
var tpTarget = null, tpSel = {h:0,m:0,s:0}, tpBackup = '';
function openTimePop(input){
  var pop = document.getElementById('timePop');
  if(tpTarget === input && pop.classList.contains('open')){ closeTimePop(false); return; }
  tpTarget = input; tpBackup = input.value;
  var parts = (input.value||'').split(':');
  tpSel = { h:+parts[0]||0, m:+parts[1]||0, s:+parts[2]||0 };
  buildTpCol('tpH', 23, 'h'); buildTpCol('tpM', 59, 'm'); buildTpCol('tpS', 59, 's');
  pop.classList.add('open');
  // 弹层定位到被点击时间框的正下方（Element 风格），不超出日期面板右缘
  var panel = document.getElementById('datePanel');
  var ir = input.getBoundingClientRect(), pr = panel.getBoundingClientRect();
  var left = ir.left - pr.left;
  var maxLeft = pr.width - pop.offsetWidth - 8;
  pop.style.left = Math.max(8, Math.min(left, maxLeft)) + 'px';
  pop.style.top = (ir.bottom - pr.top + 4) + 'px';
  // 必须在弹层可见后滚动定位（display:none 时 scrollTop 赋值无效），选中值居中
  ['tpH','tpM','tpS'].forEach(function(id){
    var col = document.getElementById(id);
    var sel = col.querySelector('.sel');
    if(sel) col.scrollTop = Math.max(0, sel.offsetTop - col.clientHeight/2 + 13);
  });
}
function buildTpCol(id, max, key){
  var col = document.getElementById(id);
  var html = '';
  for(var i=0;i<=max;i++){
    html += '<div class="tp-item'+(tpSel[key]===i?' sel':'')+'" data-v="'+i+'" onclick="tpClick(\''+key+'\','+i+',this)">'+pad(i)+'</div>';
  }
  col.innerHTML = html;
  var sel = col.querySelector('.sel');
  if(sel) col.scrollTop = Math.max(0, sel.offsetTop - col.clientHeight/2 + 13);
}
function tpClick(key, v, el){
  tpSel[key] = v;
  var col = el.parentNode;
  col.querySelectorAll('.tp-item').forEach(function(n){ n.classList.remove('sel'); });
  el.classList.add('sel');
}
function closeTimePop(ok, silent){
  var pop = document.getElementById('timePop');
  if(pop.classList.contains('open') && tpTarget){
    if(ok){ tpTarget.value = pad(tpSel.h)+':'+pad(tpSel.m)+':'+pad(tpSel.s); }
    else if(!silent){ tpTarget.value = tpBackup; }
  }
  pop.classList.remove('open');
  tpTarget = null;
}

/* ========== 通用自定义下拉（.f-select.dd 品类等级/状态 + .dc-select.dd 创建时间）==========
   真实内联 SVG 三角：点击展开旋转 180° 变蓝，选中后标签变黑；选项列表不含提示词项 */
function closeAllDd(except){
  document.querySelectorAll('.filter-bar .dd.open').forEach(function(d){
    if(d !== except) d.classList.remove('open');
  });
}
document.querySelectorAll('.filter-bar .dd').forEach(function(dd){
  // 整框点击开合（互斥：先关其它）
  dd.addEventListener('click', function(e){
    e.stopPropagation();
    var wasOpen = this.classList.contains('open');
    closeAllDd(this);
    this.classList.toggle('open', !wasOpen);
  });
  // 选项点击：写入标签 + 变黑 + 高亮 + 收起
  var items = dd.querySelectorAll('.dd-item');
  items.forEach(function(it){
    it.addEventListener('click', function(e){
      e.stopPropagation();
      var label = dd.querySelector('.dd-label');
      if(label) label.textContent = this.textContent;
      dd.classList.add('has-value');
      dd.dataset.value = this.dataset.v || this.textContent;
      items.forEach(function(n){ n.classList.remove('active'); });
      this.classList.add('active');
      dd.classList.remove('open');
    });
  });
});

// 点击外部关闭下拉
document.addEventListener('click', function(e){
  if(!e.target.closest('.tree-more')){
    document.getElementById('treeDropdown').classList.remove('show');
  }
  if(!e.target.closest('.date-combo')){
    closeDatePanel();
  }
  // 点击非下拉区域：收起所有自定义下拉
  if(!e.target.closest('.filter-bar .dd')){
    closeAllDd();
  }
});

/* ========== 初始化 ========== */
document.addEventListener('DOMContentLoaded', function(){
  var body = document.getElementById('treeBody');
  renderTree(categoryData, body, 1);
  // 默认全折叠（renderTree 已不设 expanded）
});

/* ========== iframe 高度上报（壳层要求）========== */
function postHeight(){
  try{
    var h = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
    window.parent.postMessage({type:'height',value:h+32},'*');
  }catch(e){}
}
window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);

</script>
<style>
/* ===== 搜索区 PRD（紫）：Pin 悬停/开窗时搜索区外围高亮；浮窗可拖动/缩放/关闭 ===== */
#appContainer{position:relative}
#apin-search{position:absolute;z-index:120;width:40px;height:40px;border-radius:50%;background:#ede9fe;color:#7c3aed;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.5px;cursor:pointer;box-shadow:0 2px 10px rgba(139,92,246,.4);border:2px solid #a78bfa;user-select:none;transition:transform .15s,background .15s;line-height:1}
#apin-search:hover{transform:scale(1.12);background:#ddd6fe}
.filter-bar.apin-highlight{box-shadow:0 0 0 2px #a78bfa,0 0 22px rgba(139,92,246,.5)!important}
.pinwin{position:absolute;z-index:400;width:470px;min-width:300px;min-height:180px;background:#fff;border:1px solid #e5e6eb;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.16);display:flex;flex-direction:column;font-size:13px;color:#1d2129;overflow:hidden}
.pinwin-head{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 14px;background:#8b5cf6;color:#fff;cursor:move;user-select:none;flex-shrink:0}
.pinwin-title{font-weight:600;font-size:13.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinwin-close{width:22px;height:22px;border:none;background:rgba(255,255,255,.18);color:#fff;border-radius:6px;cursor:pointer;font-size:14px;line-height:1;display:grid;place-items:center;flex-shrink:0}
.pinwin-close:hover{background:rgba(255,255,255,.32)}
.pinwin-body{overflow:auto;padding:8px 14px 14px;flex:1}
.psec{margin-bottom:12px}
.psec-title{font-weight:600;font-size:13px;color:#1d2129;margin:6px 0 8px;display:flex;align-items:center}
.psec-title .n{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#8b5cf6;color:#fff;font-size:11px;font-weight:700;margin-right:6px;flex-shrink:0}
.prow{display:grid;gap:10px;align-items:center;padding:5px 8px;border-radius:6px}
.prow3{grid-template-columns:minmax(120px,1.1fr) minmax(104px,.9fr) 2fr}
.prow2{grid-template-columns:minmax(120px,1fr) 2.2fr}
.prow.head{background:#fafbfc;color:#86909c;font-size:12px;font-weight:500}
.prow>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow:not(.head):hover{background:#f7f9fc}
.pinwin-rs{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 55%,rgba(139,92,246,.6) 55%)}
</style>
<script>
/* ===== 搜索区单 Pin + 浮窗（内容：搜索条件 / 操作按钮）===== */
(function(){
  var cfg = {
    title: '搜索区说明',
    conditions: [
      ['请输入中文名称', '输入框', '模糊查询；默认为空'],
      ['请选择品类等级', '下拉框（单选）', '单选过滤（一级/二级/三级）；默认为空'],
      ['请选择状态', '下拉框（单选）', '单选过滤（启用/禁止）；默认为空'],
      ['创建时间', '类型下拉（单选）+ 日期范围', '类型单选（默认选中“创建时间”）；起止时间精准匹配；默认日期为空']
    ],
    buttons: [
      ['重置', '清空全部条件：输入清空、下拉与日期恢复默认（空/默认选中项）']
    ]
  };
  var app = document.getElementById('appContainer');
  var panel = document.querySelector('.filter-bar');
  if(!app || !panel) return;
  var dot = document.createElement('div');
  dot.id = 'apin-search'; dot.title = cfg.title; dot.textContent = 'PRD';
  app.appendChild(dot);
  function posDot(){
    var c = app.getBoundingClientRect(), p = panel.getBoundingClientRect();
    dot.style.left = Math.round(p.right - c.left + 6) + 'px';
    dot.style.top = Math.round(p.top - c.top + p.height / 2 - 20) + 'px';
  }
  posDot(); window.addEventListener('resize', posDot);
  var win = document.createElement('div'); win.className = 'pinwin'; win.style.display = 'none';
  var rows = '';
  rows += '<div class="psec"><div class="psec-title"><span class="n">1</span>搜索条件</div>';
  rows += '<div class="prow prow3 head"><span>条件</span><span>类型</span><span>说明</span></div>';
  cfg.conditions.forEach(function(r){ rows += '<div class="prow prow3"><span>' + r[0] + '</span><span>' + r[1] + '</span><span>' + r[2] + '</span></div>'; });
  rows += '</div><div class="psec"><div class="psec-title"><span class="n">2</span>操作按钮</div>';
  rows += '<div class="prow prow2 head"><span>按钮</span><span>说明</span></div>';
  cfg.buttons.forEach(function(r){ rows += '<div class="prow prow2"><span>' + r[0] + '</span><span>' + r[1] + '</span></div>'; });
  rows += '</div>';
  win.innerHTML = '<div class="pinwin-head"><span class="pinwin-title">' + cfg.title + '</span><button class="pinwin-close" title="关闭">×</button></div><div class="pinwin-body">' + rows + '</div><div class="pinwin-rs" title="拖拽右下角缩放"></div>';
  document.body.appendChild(win);
  var head = win.querySelector('.pinwin-head'), close = win.querySelector('.pinwin-close'), rs = win.querySelector('.pinwin-rs');
  var open = false, hovered = false;
  function refresh(){ panel.classList.toggle('apin-highlight', open || hovered); }
  dot.addEventListener('mouseenter', function(){ hovered = true; refresh(); });
  dot.addEventListener('mouseleave', function(){ hovered = false; refresh(); });
  function position(){
    var p = panel.getBoundingClientRect();
    var w = win.offsetWidth || 470, h = win.offsetHeight || 240;
    var sx = window.pageXOffset || 0, sy = window.pageYOffset || 0;
    var vw = document.documentElement.clientWidth || window.innerWidth;
    var L = Math.min(p.right + sx + 8, vw - w - 12); L = Math.max(8, L);
    var T = Math.max(8, p.top + sy + 4);
    win.style.left = L + 'px'; win.style.top = T + 'px';
  }
  function toggle(){
    if(open){ win.style.display = 'none'; open = false; }
    else { win.style.display = 'flex'; position(); open = true; if(window.postHeight) window.postHeight(); }
    refresh();
  }
  dot.addEventListener('click', toggle);
  close.addEventListener('click', toggle);
  head.addEventListener('mousedown', function(e){
    if(e.target.closest('.pinwin-close')) return;
    var sx = e.clientX, sy = e.clientY, oL = win.offsetLeft, oT = win.offsetTop;
    function mv(ev){
      win.style.left = Math.min(Math.max(ev.clientX - sx + oL, -win.offsetWidth + 90), window.innerWidth - 40) + 'px';
      win.style.top = Math.min(Math.max(ev.clientY - sy + oT, 0), window.innerHeight - 40) + 'px';
    }
    function up(){ document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); }
    document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
  });
  rs.addEventListener('mousedown', function(e){
    e.preventDefault(); e.stopPropagation();
    var sx = e.clientX, sy = e.clientY, ow = win.offsetWidth, oh = win.offsetHeight;
    function mv2(ev){
      win.style.width = Math.min(Math.max(300, ow + ev.clientX - sx), window.innerWidth - 24) + 'px';
      win.style.height = Math.min(Math.max(200, oh + ev.clientY - sy), window.innerHeight - 24) + 'px';
    }
    function up2(){ document.removeEventListener('mousemove', mv2); document.removeEventListener('mouseup', up2); }
    document.addEventListener('mousemove', mv2); document.addEventListener('mouseup', up2);
  });
})();
</script>
